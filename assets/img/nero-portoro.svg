<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171411"/>
      <stop offset="35%" stop-color="#0E0C0A"/>
      <stop offset="70%" stop-color="#1A1612"/>
      <stop offset="100%" stop-color="#0B0908"/>
    </linearGradient>
    <linearGradient id="goldVein1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFE484"/>
      <stop offset="30%" stop-color="#F5BD38"/>
      <stop offset="65%" stop-color="#C98818"/>
      <stop offset="100%" stop-color="#FBE078"/>
    </linearGradient>
    <linearGradient id="goldVein2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="50%" stop-color="#E5A524"/>
      <stop offset="100%" stop-color="#8F5D0B"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#F5BD38" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#C98818" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="marbleNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.022" numOctaves="4" seed="14" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="36" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#obsidian)"/>
  <rect width="1600" height="900" fill="url(#amberGlow)"/>
  <!-- Subtle smoky quartz clouds -->
  <g opacity="0.22">
    <ellipse cx="420" cy="260" rx="380" ry="160" fill="#33281A" transform="rotate(-18 420 260)"/>
    <ellipse cx="1180" cy="540" rx="460" ry="210" fill="#2B2114" transform="rotate(14 1180 540)"/>
  </g>
  <!-- Dramatic Nero Portoro Yellow-Gold Veins -->
  <g filter="url(#marbleNoise)">
    <!-- Primary main golden-yellow vein -->
    <path d="M-80 720 C 180 610, 310 430, 560 390 C 810 350, 960 190, 1240 140 C 1410 110, 1520 40, 1680 -20" fill="none" stroke="url(#goldVein1)" stroke-width="7.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M-80 720 C 180 610, 310 430, 560 390 C 810 350, 960 190, 1240 140 C 1410 110, 1520 40, 1680 -20" fill="none" stroke="#FFF6C2" stroke-width="2" stroke-opacity="0.85"/>
    <!-- Secondary branching yellow-gold veins -->
    <path d="M290 485 C 420 510, 540 620, 760 660 C 980 700, 1190 590, 1480 690 L 1660 740" fill="none" stroke="url(#goldVein2)" stroke-width="4.5" stroke-opacity="0.9"/>
    <path d="M560 390 C 640 280, 740 210, 890 80 L 1020 -30" fill="none" stroke="url(#goldVein1)" stroke-width="3.5" stroke-opacity="0.85"/>
    <path d="M840 310 C 980 360, 1120 340, 1340 440 C 1460 495, 1550 470, 1650 510" fill="none" stroke="url(#goldVein1)" stroke-width="3" stroke-opacity="0.8"/>
    <!-- Fine capillary golden fissures -->
    <path d="M40 240 C 220 290, 380 210, 590 270 C 740 310, 830 420, 1040 460" fill="none" stroke="#F8C94E" stroke-width="1.8" stroke-opacity="0.65"/>
    <path d="M120 860 C 360 760, 520 790, 740 660" fill="none" stroke="#E5A524" stroke-width="2.2" stroke-opacity="0.7"/>
    <path d="M980 190 C 1120 240, 1290 210, 1540 280" fill="none" stroke="#FFE68A" stroke-width="1.6" stroke-opacity="0.7"/>
    <path d="M620 530 C 780 490, 910 560, 1140 490" fill="none" stroke="#D9941A" stroke-width="1.4" stroke-opacity="0.55"/>
    <!-- White-calcite micro-veins typical of authentic Italian Portoro -->
    <path d="M-40 410 C 260 360, 510 450, 860 320 C 1150 210, 1380 290, 1640 190" fill="none" stroke="#F7EFE0" stroke-width="1.1" stroke-opacity="0.32"/>
    <path d="M450 890 C 670 720, 920 760, 1290 560" fill="none" stroke="#F7EFE0" stroke-width="0.9" stroke-opacity="0.25"/>
  </g>
</svg>