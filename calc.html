<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Калькулятор плитки и клея — Абба Керамика</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="data.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/calc.js"></script>
  <script defer src="assets/js/assistant.js"></script>
</head>
<body>
  <header id="siteHeader" class="hd"></header>
  <main class="sec" style="padding-top:28px">
    <div class="wrap">
      <h1 style="margin:0 0 8px;font-size:clamp(30px,3.6vw,44px)">Калькулятор плитки и материалов</h1>
      <p class="muted" style="margin:0 0 24px">Точный расчёт упаковок, мешков клея, затирки и СВП под ваше помещение.</p>

      <div class="two-col">
        <div class="panel-card" style="display:flex;flex-direction:column;gap:16px">
          <div class="field">
            <label for="calcTile">Коллекция из каталога</label>
            <select id="calcTile" class="inp"></select>
          </div>
          <div class="field">
            <label for="calcMode">Способ расчёта</label>
            <select id="calcMode" class="inp">
              <option value="dims">По длине и ширине помещения</option>
              <option value="area">По известной площади (м²)</option>
            </select>
          </div>
          <div id="calcDimsWrap" class="two-col" style="gap:12px">
            <div class="field"><label for="calcLen">Длина, м</label><input id="calcLen" type="number" class="inp" value="4.2" step="0.1" min="0.5"></div>
            <div class="field"><label for="calcWid">Ширина, м</label><input id="calcWid" type="number" class="inp" value="3.4" step="0.1" min="0.5"></div>
          </div>
          <div id="calcDirectWrap" style="display:none">
            <div class="field"><label for="calcAreaDirect">Площадь укладки, м²</label><input id="calcAreaDirect" type="number" class="inp" value="18" step="0.5" min="1"></div>
          </div>
          <div class="field">
            <label for="calcLay">Способ укладки (запас на подрезку)</label>
            <select id="calcLay" class="inp">
              <option value="straight">Прямая раскладка (+10%)</option>
              <option value="diag">По диагонали (+15%)</option>
              <option value="herring">Ёлочкой (+18%)</option>
            </select>
          </div>
        </div>

        <div class="sum-box" style="position:static">
          <h3 style="margin-top:0">Результаты расчёта</h3>
          <div id="calcOut"></div>
        </div>
      </div>
    </div>
  </main>
  <footer id="siteFooter" class="ft"></footer>
</body>
</html>
