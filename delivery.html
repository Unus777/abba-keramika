<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Доставка и самовывоз — Абба Керамика</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/mg.css">
  <script defer src="data.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/assistant.js"></script>
  <script>
    (function () {
      var brief = false, reduce = false;
      try { brief = !!sessionStorage.getItem('abba-pl'); } catch (e) {}
      try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      var root = document.documentElement;
      if (reduce && brief) return;
      root.classList.add(reduce ? 'preload-reduce' : brief ? 'preload-brief' : 'is-loading');
      var max = reduce ? 280 : brief ? 400 : 2500;
      var min = reduce ? 0 : brief ? 200 : 1400;
      var done = false, t0 = Date.now();
      function hide() {
        if (done) return;
        done = true;
        root.classList.add('preload-done');
        try { sessionStorage.setItem('abba-pl', '1'); } catch (e) {}
        setTimeout(function () {
          root.classList.remove('is-loading', 'preload-brief', 'preload-reduce');
          var el = document.getElementById('abbaPreloader');
          if (el) el.remove();
        }, 700);
      }
      function ready() {
        var wait = min - (Date.now() - t0);
        setTimeout(hide, wait > 0 ? wait : 0);
      }
      if (document.readyState === 'complete') ready();
      else window.addEventListener('load', ready);
      setTimeout(hide, max);
    })();
  </script>
  <noscript><style>.abba-pl{display:none!important}</style></noscript>
</head>
<body class="mg">
  <div id="abbaPreloader" class="abba-pl" role="status" aria-live="polite" aria-label="Загрузка">
    <div class="abba-pl-stage">
      <div class="abba-pl-mosaic">
        <span></span><span></span><span></span>
        <span></span>
        <span class="abba-pl-mark"><svg viewBox="0 0 72 72" aria-hidden="true"><path d="M10 57 Q25 44 36 48 T63 24" fill="none" stroke="#C98A5E" stroke-width="1.6" stroke-opacity=".85"/><path d="M36 13 L54 57 H46.4 L42.2 46.6 H29.8 L25.6 57 H18 L36 13 Z M36 25.8 L32 39.4 H40 L36 25.8 Z" fill="#F4F1EC"/></svg></span>
        <span></span>
        <span></span><span></span><span></span>
      </div>
      <div class="abba-pl-brand"><b>АББА</b><small>керамика</small></div>
    </div>
  </div>

  <header id="siteHeader" class="hd"></header>
  <main class="sec" style="padding-top:28px">
    <div class="wrap">
      <h1 style="margin:0 0 8px;font-size:clamp(30px,3.6vw,44px)">Доставка и самовывоз со складов</h1>
      <p class="muted" style="margin:0 0 26px">Бережная перевозка керамогранита на паллетах с фиксацией. Отгрузка из Мытищ, Москвы и Твери.</p>

      <div class="three-col" id="delTariffs"></div>

      <div class="panel-card" style="margin-top:26px">
        <h2 style="margin-top:0">Пункты самовывоза</h2>
        <div id="delBranches" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
    </div>
  </main>
  <footer id="siteFooter" class="ft"></footer>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var U = window.UN;
      if (!U) return;
      var d = (U.cfg && U.cfg.delivery) || { free_from: 50000, moscow: 2500, mo: 3900, tver: 2900 };
      document.getElementById('delTariffs').innerHTML =
        '<div class="panel-card"><span class="tag tag-gold">Москва</span><h3 style="margin:10px 0">' + U.rub(d.moscow) + '</h3><p class="muted">Бесплатно от ' + U.rub(d.free_from) + '. Доставка на следующий день до подъезда.</p></div>' +
        '<div class="panel-card"><span class="tag tag-gold">Московская область</span><h3 style="margin:10px 0">от ' + U.rub(d.mo) + '</h3><p class="muted">Отгрузка со склада в Мытищах или Люблино. Манипулятор по запросу.</p></div>' +
        '<div class="panel-card"><span class="tag tag-gold">Тверь и область</span><h3 style="margin:10px 0">' + U.rub(d.tver) + '</h3><p class="muted">Отгрузка со склада ул. Коминтерна 44 или пос. Новая Константиновка д. 1.</p></div>';
      document.getElementById('delBranches').innerHTML = U.branches().map(function (b) {
        return '<div class="sum-row"><span><b>' + U.esc(b.city) + '</b> — ' + U.esc(b.address) + (b.warehouse_address ? ' (' + U.esc(b.warehouse_address) + ')' : '') + '</span><b>' + U.esc(b.phone) + '</b></div>';
      }).join('');
    });
  </script>
</body>
</html>
